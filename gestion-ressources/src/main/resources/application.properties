spring.application.name=gestion-ressources

# Server
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_ressources
spring.datasource.username=postgres
spring.datasource.password=ziad@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Dev mode: recreate schema to avoid legacy FK conflicts after model changes
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# Please replace with a strong 256-bit safe secret in production
application.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Jackson Configuration (Avoid lazy loading exceptions)
spring.jackson.serialization.fail-on-empty-beans=false

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.faculte.gestion_ressources=DEBUG